name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    uses: tinyland-inc/ci-templates/.github/workflows/js-bazel-package.yml@a929a9c7451a6213c7535e6d57a231a279463c00
    with:
      runner_mode: repo_owned
      runner_labels_json: ${{ vars.PRIMARY_LINUX_RUNNER_LABELS_JSON }}
      workspace_mode: isolated
      npm_publish_mode: disabled
      node_versions: '["20", "22"]'
      publish_node_version: "22"
      pnpm_version: "9.15.9"
      prepare_command: pnpm exec svelte-kit sync
      metadata_check_command: pnpm check:release-metadata
      lint_command: pnpm lint
      typecheck_command: pnpm check
      unit_test_command: pnpm test:unit
      integration_test_command: pnpm test:integration
      build_command: pnpm build
      package_check_command: pnpm check:package
      bazel_targets: "//:typecheck //:pkg //:test"
      emit_bzlmod_lock_artifact: true
      # Cache-first shared-cache-backed Bazel validation (TIN-2110 pilot).
      # Same opt-in lane as CI; endpoint injected at runtime, no executor.
      cache_backed: true
      package_dir: ./bazel-bin/pkg
      npm_access: public
      github_package_name: "@jesssullivan/scheduling-kit"
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
